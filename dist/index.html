<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelseys Weather App</title>

    <!--Web Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

    <!--Custom CSS-->
    <link rel="stylesheet" href="/My%20Weather%20App.77a9bc14.css">

    <!--Weather Icons CSS by Erik Flowers-->
    <link rel="stylesheet" href="/My%20Weather%20App.86b910f5.css">
    <link rel="stylesheet" href="/My%20Weather%20App.a3f81e9f.css">
    

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--JavaScript-->
    <script type="module" src="/My%20Weather%20App.b828852a.js" defer=""></script>

</head>
<body>

    <main>
        <div class="container text-center text-nowrap">

            <!--Weather Card-->
            <div class="card col-10 col-lg-6 mx-auto">
                <!--Card Header-->
                <div class="card-header d-flex flex-column">

                    <!--City Search-->
                    <form class="row align-items-center gy-2 gx-3">
                        <div class="col-12 col-sm-9 col-md-10 col-lg-9">
                            <input type="text" class="city-search form-control" id="citySearch" placeholder=" City">
                        </div>


                        <!--Celcius / Farenheit Toggle-->
                        <div class="col-12 col-sm-3 col-md-2 col-lg-3">
                            <div class="d-flex flex-row justify-content-start">
                                <!--Celcius Label-->
                                <div class="pe-1">°C</div>
                                <!--Toggle-->
                                <div class="form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                                    <label class="form-check-label" for="switchCheckDefault"></label>
                                </div>
                                <!--Farenheit Label-->
                                <div class="">°F</div>
                            </div>
                        </div>
                    </form>
                </div>
                
                <!--Card Body: Weather Data-->
                <div class="card-body d-flex flex-column justify-content-center flex-lg-row justify-content-lg-evenly align-items-center">
                    <div class="d-flex flex-column justify-content-center align-items-center">
                        <!--City Name-->
                        <p class="city-display" id="cityDisplay">Edmonton</p>
                        <!--Weather Description-->
                        <p class="fs-6 text-center fw-lighter">Sunny, Clear</p>
                    </div>
                    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center column-gap-5">
                        <!--Weather Icon-->
                        <i class="wi wi-day-sunny display-1" id="currentWeatherIcon"></i>
                        <!--Current Temperature-->
                        <p class="display-4"><span id="currentWeatherNumber">30</span>°</p>
                    </div>
                </div>

                <!--TODO: FEATURE: 5 day forecast:

                    <h2 class="display-6">5 Day Forecast</h2>

                    </div>
                </div>

        </div>
    </main>
    

</body></html>
