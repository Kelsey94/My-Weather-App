<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kelseys Weather App</title>
        <!--Favicon-->
        <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
        <link rel="manifest" href="img/site.webmanifest">

        <!--Web Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap" rel="stylesheet">

        <!--Bootstrap 5 CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        


        <!--Custom CSS-->
        <link rel="stylesheet" href="css/styles.css">

        <!--Weather Icons CSS by Erik Flowers-->
        <link rel="stylesheet" href="css/weather-icons.css">

        <!--JavaScript-->
        <script src="js/utils.js" defer></script>
        <script src="js/api.js" defer></script>
        <script src="js/ui.js" defer></script>
        <script src="js/main.js" defer></script>

    </head>

    <body>

        <main>
            <div class="text-center text-nowrap">
                <!--Weather Card-->
                <div class="card col-11 col-sm-10 col-md-8 col-lg-6 mx-auto my-4">
                    <!--Card Header-->
                    <div class="card-header d-flex flex-column py-4">
                        <!--City Search-->
                        <div class="container">
                            <div class="row justify-content-center">
                                <div
                                    class="search-container position-relative p-0 m-0">
                                    <form class="d-flex align-items-center w-100" id="citySearchForm">
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            width="20" height="20"
                                            viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor"
                                            stroke-width="2"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="search-icon feather feather-search">
                                            <circle cx="11" cy="11"
                                                r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65"
                                                y2="16.65"></line>
                                        </svg>
                                        <input
                                            class="form-control search-input ps-5"
                                            id="citySearch" 
                                            type="search"
                                            placeholder="City Name"
                                            aria-label="Search"
                                            autocomplete="on"
                                            autocapitalize="on"
                                            >
                                        <button
                                            class="btn btn-search bg-primary mx-2 rounded-5 text-white px-3 me-0"
                                            type="submit">Search</button>
                                    </form>
                                    <div class="dropdown visually-hidden">
                                        <div id="cityList" class="dropdown-content">
                                            
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--Card Body: Weather Data-->
                    <div class="card-body d-flex flex-column justify-content-center justify-content-lg-evenly align-items-center position-relative">
                        <!--Celcius / Farenheit Toggle-->
                        <div class="position-absolute top-0 end-0 pe-2 pt-2">
                            <div class="d-flex flex-row justify-content-start">
                                <!--Celcius Label-->
                                <div class="pe-1">&deg;C</div>
                                <!--Toggle-->
                                <div class="form-switch">
                                    <input class="form-check-input"
                                        type="checkbox" role="switch"
                                        id="switchCheckDefault">
                                    <label class="form-check-label"
                                        for="switchCheckDefault"></label>
                                </div>
                                <!--Farenheit Label-->
                                <div class>&deg;F</div>
                            </div>
                        </div>

                        <!--Weather Data-->
                        <div class="d-flex flex-column justify-content-center align-items-center">
                            <!--Empty Weather Data Message-->
                            <p id="emptyWeatherMsg" class="w-100 mx-auto text-wrap py-5 mt-4 text-secondary text-center">Enter a city name to get the current weather</p>
                            <!--City Name-->
                            <p class="city-display mb-0"
                                id="cityDisplay"></p>
                            <!--Local Time-->
                            <p class="local-time text-muted small fw-light mb-0" id="localTime"></p>
                            <!--Weather Description-->
                            <p class="fs-6 text-center fw-lighter mb-0" id="currentWeatherDescription"></p>
                            <!--Feels Like Temp-->
                            <p class="fs-6 text-center fw-lighter mb-0" id="feelsLikeTemp"></p>
                        </div>
                        <div
                            class="d-flex flex-column justify-content-center align-items-center column-gap-5">
                            <!--Weather Icon-->
                            <i class="wi"
                                id="currentWeatherIcon"></i>
                            <!--Current Temperature-->
                            <p class="display-4">
                                <span id="currentWeatherNumber"></span>
                            </p>
                        </div> 
                    </div>

                    <!--More Weather Details Menu-->
                    <div class="card-body my-tooltip p-0 m-0">
                        <!--Down Arrow-->
                        <svg id="accordionButtonDown" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="lightgrey" class="bi bi-chevron-compact-down m-0 p-0" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1.553 6.776a.5.5 0 0 1 .67-.223L8 9.44l5.776-2.888a.5.5 0 1 1 .448.894l-6 3a.5.5 0 0 1-.448 0l-6-3a.5.5 0 0 1-.223-.67" />
                        </svg>

                        <!--Up Arrow-->
                        <svg id="accordionButtonUp" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="lightgrey" class="d-none bi bi-chevron-compact-up m-0 p-0" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M7.776 5.553a.5.5 0 0 1 .448 0l6 3a.5.5 0 1 1-.448.894L8 6.56 2.224 9.447a.5.5 0 1 1-.448-.894z"/>
                        </svg>
                    </div>
                    

                    <div id="moreDetail" class="d-none card-footer">
                        <div class="detail-cards">
                            <!--UV Index Container-->
                            <div class="detail-box-container">
                                <!--UV Index Label-->
                                <p id="uv_index" class="detail-title">
                                    UV Index:
                                    <span id="uv-index-num" class="detail-num">
                                        <!--UV Index Number Goes Here-->
                                    </span>
                                </p>
                                <!--UV Index Slider-->
                                <div class="slider">
                                <!--UV Index Slider Label: Low, Moderate, High, Very High, Extreme-->
                                    <label for="uv_index-range" id="uv-index-summary" class="detail-summary"></label>
                                    <input
                                        class="range-slider"
                                        id="uv-index-range"
                                        type="range"
                                        name="uv-index-num"
                                        min="1"
                                        max="13"
                                        value=""
                                        disabled>
                                </div>
                            </div>

                            <!--Humidity Container-->
                            <div class="detail-box-container">
                                <!--Humidity Label-->
                                <p id="humidity" class="detail-title">
                                    Humidity:
                                    <span id="humidity-num" class="detail-num">
                                        <!--Humidity % Goes Here-->
                                    </span>
                                </p>
                                <!--Humidity Slider-->
                                <div class="slider">
                                    <label for="humidity-range" id="humidity-summary" class="detail-summary"></label>
                                    <input
                                        class="range-slider"
                                        id="humidity-range"
                                        type="range"
                                        name="humidex-num"
                                        min="1"
                                        max="100"
                                        value=""
                                        disabled>
                                </div>
                            </div>
                        </div> 
                        <div class="forecast d-none">
                        
                            <h2 class="d-none fs-5 fw-normal">3-Day Forecast</h2>
                            <div id="forecast" class="row justify-content-evenly">
                                <div class="m-1 bg-light border border-dark-subtle col-3 rounded-4">Hi</div>
                                <div class="m-1 bg-light border border-dark-subtle col-3 rounded-4">Hi</div>
                                <div class="m-1 bg-light border border-dark-subtle col-3 rounded-4">Hi</div>
                            </div>
                        </div>
                    </div>
                </div> 
            </div>
        </main>

        <div class="btn-add position-fixed bottom-0 end-0 p-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#fff" class="bi bi-plus-circle" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
              </svg>
        </div>
    </body>

</html>
