<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelseys Weather App</title>

    <!--Web Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!--Custom CSS-->
    <link rel="stylesheet" href="css/styles.css">

    <!--Weather Icons CSS by Erik Flowers-->
    <link rel="stylesheet" href="css/weather-icons.css">
    <link rel="stylesheet" href="css/weather-icons-wind.css">

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--JavaScript-->
    <script defer src="js/main.js"></script>

</head>
<body>

    <main>
        <div class="container text-center text-nowrap">

            <!--Weather Card-->
            <div class="card col-10 col-lg-6 mx-auto">
                <!--Card Header-->
                <div class="card-header d-flex justify-content-between">
                    <!--City Search-->
                    <form class="form form-text">
                        <input type="text" class=""
                        placeholder=" City">
                    </form>
                    <!--Celcius / Farenheit Toggle-->
                    <div class="d-flex column-gap-2">
                        <div class="pe-2">&deg;C</div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                            <label class="form-check-label" for="switchCheckDefault"></label>
                        </div>
                        <div class="">&deg;F</div>
                    </div>
                    

                </div>
                
                <div class="card-body d-flex flex-column justify-content-center">
                    
                    <p class="display-4">City</p>

                    <!--Weather Icon-->
                    <i class="wi wi-day-sunny display-1"></i>

                    <!--Current Temperature-->
                    <p class="display-4"><span>30</span>&deg;</p>

                </div>

                <div class="card-footer">
                    <h2 class="display-6">5 Day Forecast</h2>
                    <div class="d-lg-flex justify-content-evenly">
                        <!--5 day forecast-->

                        <div class="card d-flex flex-column">
                            <p class="card-header">Saturday</p>
                            <i class="wi wi-day-sunny"></i>
                            <p>30&deg;</p>
                        </div>

                        <div class="card d-flex flex-column">
                            <p class="card-header">Sunday</p>
                            <i class="wi wi-day-sunny"></i>
                            <p>30&deg;</p>
                        </div>

                        <div class="card d-flex flex-column">
                            <p class="card-header">Monday</p>
                            <i class="wi wi-day-sunny"></i>
                            <p>30&deg;</p>
                        </div>

                        <div class="card d-flex flex-column">
                            <p class="card-header">Tuesday</p>
                            <i class="wi wi-day-sunny"></i>
                            <p>30&deg;</p>
                        </div>

                        <div class="card d-flex flex-column">
                            <p class="card-header">Wednesday</p>
                            <i class="wi wi-day-sunny"></i>
                            <p>30&deg;</p>
                        </div>

                    </div>
                </div>


            </div>
            
        </div>
    </main>
    
</body>
</html>
